openapi: 3.0.3
info:
  title: UnoRouter API
  description: Backend API for the UnoRouter Dashboard. Designed in accordance with ENGINEERING-STANDARDS.md and PAGES.md.
  version: 1.0.0

servers:
  - url: /api
    description: Next.js API Routes

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: HTTP-only JWT cookie for authentication.

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: User-friendly error message. Technical details are logged on the server.
          example: "Invalid credentials provided."


    Provider:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        subscription_tier:
          type: string
          enum: [Free, Pro, Enterprise]
        current_balance:
          type: number
          format: float
          description: Materialized balance field.
        created_at:
          type: string
          format: date-time

    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    Model:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider_name:
          type: string
        context_size:
          type: integer
        price_per_1m:
          type: number
          format: float
        speed_tok_s:
          type: integer
        is_free:
          type: boolean
        category:
          type: string
          enum: [Coding, Chat, Character]
      popularity_score:
        type: integer
        description: Pre-calculated score for sorting by 'Popular'. Updated via cron.
      release_tag:
        type: string
        nullable: true
        description: Badge label like 'New Weights' or '1-Tier'.

    UsageLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        model_name:
          type: string
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        cost:
          type: number
          format: float
        created_at:
          type: string
          format: date-time

    Ranking:
      type: object
      properties:
        rank:
          type: integer
        model:
          $ref: '#/components/schemas/Model'
        score:
          type: integer
        speed_viz:
          type: integer
        weekly_change:
          type: integer

    ChatSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        created_at:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sender:
          type: string
          enum: [User, Bot]
        content:
          type: string
        created_at:
          type: string
          format: date-time

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, username]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                username:
                  type: string
      responses:
        '201':
          description: User registered successfully. Sets HTTP-only cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request (e.g., email already exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful. Sets HTTP-only cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      responses:
        '200':
          description: Successfully logged out. Clears HTTP-only cookie.

  /auth/me:
    get:
      summary: Get current authenticated user
      tags: [Auth]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized.

  /dashboard/stats:
    get:
      summary: Get unified dashboard statistics
      description: Returns data for the 4 main stat cards on the dashboard. Consolidated to prevent client-side request waterfalls.
      tags: [Dashboard]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Dashboard stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_balance:
                    type: number
                  consumption:
                    type: number
                  number_of_requests:
                    type: integer
                  statistical_count:
                    type: integer
                  statistical_quota:
                    type: number
                  statistical_tokens:
                    type: integer
                  average_rpm:
                    type: integer
                  average_tpm:
                    type: integer

  /dashboard/chart:
    get:
      summary: Get time-series data for dashboard charts
      tags: [Dashboard]
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: range
          schema:
            type: string
            enum: [7d, 30d, 90d]
        - in: query
          name: tab
          schema:
            type: string
            enum: [consumption_distribution, consumption_trend, calls_distribution, calls_ranking]
      responses:
        '200':
          description: Chart data.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    value:
                      type: number


  /providers:
    get:
      summary: List all model providers
      description: Used to dynamically populate provider filter dropdowns on the Models page.
      tags: [Models]
      responses:
        '200':
          description: List of providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'

  /models:
    get:
      summary: List and filter models
      tags: [Models]
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: tier
          schema:
            type: string
            enum: [All, Free, Paid]
        - in: query
          name: sort
          schema:
            type: string
            enum: [popular, newest, price]
      responses:
        '200':
          description: List of models.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'


  /models/{id}:
    get:
      summary: Get detailed information for a specific model
      tags: [Models]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Model details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '404':
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /models/{id}/performance:
    get:
      summary: Get performance time-series data for a model
      description: Returns historical data (e.g., speed, score) for the last 30 days. Used for the mini sparkline/bar graphs in the Rankings table.
      tags: [Models]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Time-series performance data.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    speed_tok_s:
                      type: integer

  /rankings:
    get:
      summary: Get model leaderboard rankings
      tags: [Rankings]
      responses:
        '200':
          description: Ranked models list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ranking'

  /rankings/highlights:
    get:
      summary: Get models with highest weekly change
      tags: [Rankings]
      responses:
        '200':
          description: Highlights list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ranking'

  /api-keys:
    get:
      summary: List user API keys
      tags: [API Keys]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of API keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
    post:
      summary: Create a new API key
      tags: [API Keys]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: The created API key. Contains the raw key only once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      raw_key:
                        type: string
                        description: Raw API key. Only returned once upon creation.

  /api-keys/{id}:
    delete:
      summary: Delete an API key
      tags: [API Keys]
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Successfully deleted.

  /usage-logs:
    get:
      summary: Get paginated usage logs
      tags: [Usage Logs]
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsageLog'
                  total:
                    type: integer

  /billing/top-up:
    post:
      summary: Top up user balance
      tags: [Billing]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  format: float
      responses:
        '200':
          description: Balance successfully topped up.

  /chat/sessions:
    get:
      summary: List user chat sessions
      tags: [Chat]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of chat sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSession'
    post:
      summary: Create a new chat session
      tags: [Chat]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        '201':
          description: The created chat session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'

  /chat/sessions/{id}:
    get:
      summary: Get details and messages for a chat session
      tags: [Chat]
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chat session and its messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: '#/components/schemas/ChatSession'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'

  /chat/messages:
    post:
      summary: Send a message in a chat session
      tags: [Chat]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, content]
              properties:
                session_id:
                  type: string
                  format: uuid
                content:
                  type: string
      responses:
        '201':
          description: User message recorded and bot response generated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
                description: Returns the new user message and the subsequent bot response.
